<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style1.css">
    <title>Sign In</title>
</head>
<body>
 <main>
<div class="form-container" id="form-box1">
    <h1>Welcome Back</h1>
    <p class="subtitle">Please enter your details to sign in</p>
    <form action="">
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" name="Signin-email" id="email">
        </div>
        <div class="input-group">
            <label for="passward">Passward</label>
            <input type="password" name="Signin-passward" id="passward">
        </div>
    </form>
    <a href="" class="forgot">Forgot password</a>
    <div>
        <button type="submit" class="Signin-btn">Sign In</button>
    </div>
    <p class="switch-text">Don't have an account? <a href="./Signup.html" class="switch-link">Sign Up</a></p>
</div>
 </main>
</body>
</html>
