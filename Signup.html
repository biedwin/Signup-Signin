<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style.css">
    <title>SIGN UP</title>
</head>
<body>
    <main>
        <div class="form-container" id="form-box"> 
            <h1>Create Account</h1>
            <p class="subtitle">Join us today by filling out your info</p>
            <form action="">
                <div class="input-group">
                    <label for=fullname>Fullname</label>
                    <input type="text" name="signup-Fullname" id="Fullname">
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="signup-email" id="email">
                </div>
                <div class="input-group">
                    <label for="passward">Passward</label>
                    <input type="password" name="signup-passward" id="passward">
                </div>
                <div>
                    <button type="submit" class="signup-btn">Sign up</button>
            </form>
            <p class="switch-text">Already have an account?
                <a href="./Signin.html" class="switch-link">Sign in</a>
                </p>
        </div>
    </main>
</body>
</html>
